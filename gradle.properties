# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true


## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The NeoForge version the mod is compiled against, see https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.228
# The NeoForge versions the mod accepts at runtime (any NeoForge for Minecraft 1.21.1).
neo_version_range=[21.1.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)


## Mod Properties

# The unique mod identifier for the mod. Must match the String constant in the @Mod class.
mod_id=pi_generator
# The human-readable display name for the mod.
mod_name=Project Infinity: Resource Generators
# The license of the mod.
mod_license=All Rights Reserved
# The mod version -> build/libs/pi_generator-0.2.jar
# 0.1 was the Forge 1.20.1 version, 0.2 is the NeoForge 1.21.1 port.
mod_version=0.2
# The group ID for the mod. Matches the base package used for the mod sources.
mod_group_id=com.projectinfinity.pigenerator
# The authors of the mod.
mod_authors=Nightmare29417
# The description of the mod.
mod_description=Eight tiers of FE-powered resource generators for the Project Infinity modpack.\nAccept energy from any FE source and auto-eject items into adjacent inventories (AE2 interfaces, chests, pipes).

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: pi_generator
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish the Gradle-built jar to release/ (one-off)
        if: github.event_name == 'push'
        run: |
          ls -la build/libs >> ci-build.log
          sha256sum build/libs/*.jar >> ci-build.log
          cp build/libs/pi_generator-0.1.jar release/pi_generator-0.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/pi_generator-0.1.jar ci-build.log
          git commit -m "Publish jar built by ./gradlew build (CI run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
